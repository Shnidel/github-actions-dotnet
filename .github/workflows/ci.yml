name: CI

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0

      - name: dotnet test
        run: dotnet test --configuration Release

      - name: dotnet publish
        run: dotnet publish src/GitHubActionsDotNet.Api/GitHubActionsDotNet.Api.csproj --configuration Release -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: dometrain-artifact
          path: artifacts/ # or path/to/artifact

  deploy_dev:
    name: Deploy Dev
    needs: build

    uses: ./.github/workflows/step-deploy.yml
    with:
      env: dev
    secrets: inherit

  deploy_prod:
    name: Deploy Prod
    needs: deploy_dev

    uses: ./.github/workflows/step-deploy.yml
    with:
      env: prod
    secrets: inherit
