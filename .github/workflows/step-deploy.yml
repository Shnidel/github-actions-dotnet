name: "Step - Deploy"

on:
    workflow_call:
        inputs:
            env:
                required: true
                type: string
        secrets:
            AZURE_CLIENT_ID:
                required: true
            AZURE_TENANT_ID:
                required: true
            AZURE_SUBSCRIPTION_ID:
                required: true

jobs:
    deploy:
        name: Deploy ${{ inputs.env }}
        runs-on: ubuntu-latest
        environment: ${{ inputs.env }}

        steps:
            - uses: actions/download-artifact@v7
              with:
                  name: dometrain-artifact
                  path: artifacts/ # or path/to/artifact

            # Deploy to Azure Web apps
            - name: Azure login
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: "Deploy to Azure Web App Service"
              uses: azure/webapps-deploy@v2
              with:
                  app-name: app-dometrain-github-actions-shnidel-${{ inputs.env }}
                  package: artifacts/
